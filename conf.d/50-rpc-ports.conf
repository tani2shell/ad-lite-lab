# Fixed RPC endpoint ports so TCP-RPC clients can traverse the NAT boundary.
# Included by the image template at the end of [global].
# Note: 'rpc_server:<ep>' controls embedding; the PORT knob is
# 'rpc server port:<ep>' plus a narrowed dynamic range (smb.conf(5)).
# PITFALL (2026-11-04实测): each RPC task server also binds a 'mgmt'
# endpoint that picks a RANDOM port from the dynamic range. If the
# dynamic range overlaps the static pins, mgmt hits a bound port ->
# NT_STATUS_ADDRESS_ALREADY_ASSOCIATED -> 'dcerpc: Failed to initialise
# end points' -> samba exits. Dynamic range MUST be disjoint from pins.
rpc server dynamic port range = 49166-49185
rpc server port:lsarpc = 49160
rpc server port:samr = 49161
rpc server port:netlogon = 49162
rpc server port:dsrscs = 49163
rpc server port:srvsvc = 49164
rpc server port:wkssvc = 49165

# allow runtime schema extensions (seed.py adds the msLite-Flag attribute)
dsdb:schema update allowed = yes
