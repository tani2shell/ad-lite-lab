# Kerberos enctypes for pentest tooling — included at end of [global]
# (smb.conf line ~30 already has 'include = /etc/samba/conf.d/60-krb5-weak.conf').
# PITFALL (2026-11-04 实测, samba 4.24.7): CVE-2026-20833 fix flipped
# 'kdc default domain supported enctypes' to AES-only at domain functional
# level 2008+. Effect on impacket posture:
#   - AS-REP roast (rc4-only AS-REQ) -> KDC_ERR_PREAUTH_REQUIRED (err 25),
#     GetNPUsers prints bogus "doesn't have UF_DONT_REQUIRE_PREAUTH".
#   - Full-login TGS -> AES TGT session key + impacket rsa-md5 authenticator
#     -> samba heimdal rejects: KRB_AP_ERR_INAPP_CKSUM.
# MIT kinit/kvno unaffected (proper RFC8009 cksum) — kvno=2 proven against
# MSSQLSvc SPN. Restore RC4 in the domain default set for lab tooling:
# value = msDS-SupportedEncryptionTypes bitmask
# 2 (rc4-hmac) + 8 (aes128) + 16 (aes256) = 26
kdc default domain supported enctypes = 26
